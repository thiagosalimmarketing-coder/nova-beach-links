<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Beach — Portal do Aluno</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #f3f5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      position: relative;
    }
    .pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: url('../nb-ball.png');
      background-repeat: repeat;
      background-size: 140px 140px;
      opacity: 0.035;
    }
    .card {
      position: relative;
      z-index: 1;
      background: #1a3066;
      border-radius: 16px;
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .logo { height: 48px; width: auto; object-fit: contain; }
    .msg { color: rgba(255,255,255,0.7); font-size: 14px; letter-spacing: 0.3px; }
    .dots span {
      display: inline-block;
      animation: blink 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
  <script>
    setTimeout(function() {
      window.location.href = 'https://nova-beach-members.vercel.app';
    }, 1500);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://nova-beach-members.vercel.app">
  </noscript>
</head>
<body>
  <div class="pattern"></div>
  <div class="card">
    <img class="logo" src="../logo-novabeach.png" alt="Nova Beach">
    <p class="msg">Abrindo Portal do Aluno<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>
</body>
</html>
