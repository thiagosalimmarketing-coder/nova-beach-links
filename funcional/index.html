      justify-content: center;

      position: relative;

    .pattern {
      position: fixed;

      background-repeat: repeat;

    }
    .card {
      position: relative;
      z-index: 1;
      background: #1a3066;
      border-radius: 20px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);

      width: 100%;

    .logo { height: 44px; width: auto; object-fit: contain; }
    .title { color: #fff; font-size: 20px; font-weight: 700; text-align: center; letter-spacing: -0.3px; }

    .buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 6px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: none;
      width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ai {
      background: linear-gradient(135deg, #ffb547 0%, #ff8c1a 100%);
      color: #3a2500;
      box-shadow: 0 4px 14px rgba(255, 140, 26, 0.35);
    }
    .btn-human {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.2);
    }
    .btn small { display: block; font-size: 11px; font-weight: 500; opacity: 0.75; margin-top: 2px; }
    .btn-content { display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
    .footer { color: rgba(255,255,255,0.4); font-size: 11px; text-align: center; margin-top: 4px; }
