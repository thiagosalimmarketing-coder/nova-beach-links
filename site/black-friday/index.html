<script>
// Atalho por canal: abre o quiz do hub ja na oferta, preservando UTMs do anuncio/stories.
// Sem dado pessoal na URL. Origem padrao quando o link vem sem UTM: {"utm_source": "site_institucional", "utm_medium": "referral", "utm_campaign": "black-friday-manha", "utm_content": "site"}
(function(){
  var q = new URLSearchParams(location.search);
  var d = {"utm_source": "site_institucional", "utm_medium": "referral", "utm_campaign": "black-friday-manha", "utm_content": "site"};
  if(!q.get('utm_source') && !q.get('fbclid')) Object.keys(d).forEach(function(k){ q.set(k, d[k]); });
  else Object.keys(d).forEach(function(k){ if(!q.get(k) && k!=='utm_source') q.set(k, d[k]); });
  q.set('p','blackfriday');
  location.replace('/?' + q.toString());
})();
</script>
